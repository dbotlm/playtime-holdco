    <!-- DYNAMIC DATA FETCHING & REVEAL SCRIPT -->
    <script>
        let animationObserver = null;

        function setupObserver() {
            if (animationObserver) {
                animationObserver.disconnect();
            }

            animationObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                });
            }, {
                threshold: 0.15,
                rootMargin: '0px 0px -50px 0px'
            });

            document.querySelectorAll('.playtime-reveal').forEach(el => animationObserver.observe(el));
        }

        async function loadPlaytimeContent() {
            try {
                const res = await fetch('/api/content');
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.success && json.data) {
                        renderPlaytimeSite(json.data);
                        return;
                    }
                }
            } catch (err) {
                console.warn('API not reachable, attempting data.json fallback:', err);
            }

            // Fallback for static hosting (GitHub Pages, Vercel, Netlify)
            try {
                const res2 = await fetch('data.json');
                if (res2.ok) {
                    const data = await res2.json();
                    renderPlaytimeSite(data);
                }
            } catch (e2) {
                console.error('Data fallback error:', e2);
            }
        }

        function renderPlaytimeSite(data) {
            // 1. Meta & Title
            if (data.meta) {
                if (data.meta.title) document.title = data.meta.title;
                if (data.meta.description) {
                    const descEl = document.getElementById('metaDesc');
                    if (descEl) descEl.setAttribute('content', data.meta.description);
                }
                if (data.meta.favicon) {
                    const fav = document.getElementById('siteFavicon');
                    if (fav) fav.href = data.meta.favicon;
                }
            }

            // 2. Hero Section
            if (data.hero) {
                if (data.hero.logoUrl) document.getElementById('heroLogo').src = data.hero.logoUrl;
                if (data.hero.titlePart1) document.getElementById('heroTitle1').textContent = data.hero.titlePart1;
                if (data.hero.titlePart2) document.getElementById('heroTitle2').textContent = data.hero.titlePart2;
            }

            // 3. Portfolio Sections
            const portContainer = document.getElementById('portfolioContainer');
            if (portContainer && data.portfolio) {
                portContainer.innerHTML = '';

                data.portfolio.forEach((comp) => {
                    const sec = document.createElement('div');
                    sec.className = 'section';
                    sec.id = `company-${comp.id}`;

                    const wrapClass = comp.bgClass ? `section-wrap ${comp.bgClass}` : 'section-wrap full';
                    const logoContClass = comp.logoContainerClass ? `logo-container ${comp.logoContainerClass}` : 'logo-container size';
                    const imgClass = comp.imageClass ? `image ${comp.imageClass}` : 'image size';
                    const isSizeM = comp.isSizeM ? ' size_m' : '';

                    // Custom background image override if provided
                    const bgStyle = comp.bgImageUrl ? `style="background-image: url('${comp.bgImageUrl}'); background-size: cover; background-position: center;"` : '';

                    sec.innerHTML = `
                        <div class="${wrapClass}" ${bgStyle}>
                            <div class="wrap_left">
                                <a id="${comp.id}-website" href="${comp.url || '#'}" target="_blank" class="cta w-inline-block playtime-reveal">
                                    <div class="${logoContClass}">
                                        <img src="${comp.logoUrl}" loading="lazy" alt="${escapeAttr(comp.name)}" class="${imgClass}"/>
                                    </div>
                                    <div class="subtitle${isSizeM}">${escapeHtml(comp.name)}</div>
                                    <div class="subtitle${isSizeM} description">${escapeHtml(comp.tagline)}</div>
                                </a>
                            </div>
                            <div class="wrap_right"></div>
                        </div>
                    `;
                    portContainer.appendChild(sec);
                });
            }

            // 4. Footer & Socials
            if (data.footer) {
                if (data.footer.logoUrl) document.getElementById('footerLogo').src = data.footer.logoUrl;
                if (data.footer.email) {
                    const emailLink = document.getElementById('footerEmail');
                    emailLink.textContent = data.footer.email;
                    emailLink.href = 'mailto:' + data.footer.email;
                }
                if (data.footer.socials) {
                    if (data.footer.socials.twitter) document.getElementById('linkTwitter').href = data.footer.socials.twitter;
                    if (data.footer.socials.instagram) document.getElementById('linkInstagram').href = data.footer.socials.instagram;
                    if (data.footer.socials.linkedin) document.getElementById('linkLinkedin').href = data.footer.socials.linkedin;
                }
            }

            // 5. Press Articles
            const pressContainer = document.getElementById('pressContainer');
            if (pressContainer && data.press) {
                pressContainer.innerHTML = '';
                data.press.forEach(pr => {
                    const a = document.createElement('a');
                    a.href = pr.url || '#';
                    a.target = '_blank';
                    a.className = 'flex_v w-inline-block playtime-reveal';
                    a.style.display = 'flex';
                    a.style.flexDirection = 'column';
                    a.style.textDecoration = 'none';
                    a.style.marginBottom = '20px';
                    a.innerHTML = `
                        <div class="subtitle title">${escapeHtml(pr.title)}</div>
                        <div class="subtitle text">${escapeHtml(pr.text)}</div>
                    `;
                    pressContainer.appendChild(a);
                });
            }

            // Trigger animations
            setupObserver();

            // Animate hero elements immediately
            const heroEls = document.querySelectorAll('.section_hero .playtime-reveal');
            heroEls.forEach((el, index) => {
                setTimeout(() => {
                    el.classList.add('is-visible');
                }, 100 + (index * 150));
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            if (!str) return '';
            return String(str).replace(/"/g, '&quot;');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPlaytimeContent();
        });
    </script>
